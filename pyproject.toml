[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-helper"
version = "0.1.0"
description = "Reusable SMTP email and Jinja template helpers for Flask and FastAPI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Jinja2>=3.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
flask = ["Flask>=2.2"]
fastapi = ["FastAPI>=0.95"]
test = ["pytest>=7"]
dev = ["pre-commit>=4", "pytest>=7", "ruff>=0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
